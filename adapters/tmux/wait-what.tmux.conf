# claude-wait-what for tmux. In ~/.tmux.conf:
#     source-file /path/to/claude-wait-what/adapters/tmux/wait-what.tmux.conf
# (replace WAIT_WHAT below with the absolute path of bin/wait-what)

# In copy mode, select text and press Ctrl+A: the selection goes to wait-what.
bind -T copy-mode    C-a send -X copy-pipe-and-cancel "WAIT_WHAT tmux --socket '#{socket_path}' --server-pid '#{pid}' --pane '#{pane_id}'"
bind -T copy-mode-vi C-a send -X copy-pipe-and-cancel "WAIT_WHAT tmux --socket '#{socket_path}' --server-pid '#{pid}' --pane '#{pane_id}'"

# With the mouse, tmux copies the selection when you release the button and
# leaves copy mode: then prefix + a uses what was just copied.
bind a run-shell "WAIT_WHAT tmux --socket '#{socket_path}' --server-pid '#{pid}' --pane '#{pane_id}' --buffer"
